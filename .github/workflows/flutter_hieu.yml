name: Flutter Hieu CI

on:
  push:
    branches:
      - hieu
  workflow_dispatch:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Cloud-only data guard
        run: python3 tool/verify_cloud_only.py

      - name: Format game code
        run: >-
          dart format
          lib/screen/boss_battle
          lib/screen/game_hub/game_hub_screen.dart
          test/screen/boss_battle

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Boss Battle tests
        run: flutter test test/screen/boss_battle

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Report APK size
        run: |
          ls -lh build/app/outputs/flutter-apk/app-debug.apk
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build/app/outputs/flutter-apk/app-debug.apk')
          size = p.stat().st_size
          print(f'APK bytes: {size:,}')
          print(f'APK MiB: {size / 1024 / 1024:.2f}')
          PY

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-hieu-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
