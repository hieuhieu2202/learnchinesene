name: SQLite Inventory

on:
  push:
    branches:
      - hieu
    paths:
      - assets/database/**
      - lib/**
      - tool/sqlite_inventory.py
      - .github/workflows/sqlite_inventory.yml
  workflow_dispatch:

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export SQLite inventory and data
        run: python3 tool/sqlite_inventory.py

      - name: Upload SQLite inventory
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-inventory
          path: build/sqlite_inventory
          if-no-files-found: error
          retention-days: 3
